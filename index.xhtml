  function createIframe(id) {

  function loadPages() {
    let page1 = document.getElementById('page1');
    if (!page1) page1 = createIframe('page1');

    let page2 = document.getElementById('page2');
    if (twoPageMode && !page2) page2 = createIframe('page2');
    if (!twoPageMode && page2) page2.remove();

    // reduce white flash on page load in dark mode
    // wait extra 100ms to avoid white flash from text layer
    page1.style.visibility = "hidden";
    page1.onload = () => { setTimeout(() => { page1.style.visibility = "visible"; }, 100); };

      let leftIndex, rightIndex;

      if (currentPage === 1) {
        leftIndex = -1;       // empty
        rightIndex = 0;       // page 1
